                                    }
                                }
                            }
                            else if (this.role === 'void') {
                                // Void: Pulls enemies in
                                const nearby = (frame + this.id) % 3 === 0 ? queryEntityGrid(this.x, this.y, 400) : [];
                                for (const e of nearby) { 
                                    if (e.team !== this.team && !e.dead && !e.isDummy) {
                                        e.vx += (this.x - e.x) * 0.015;
                                        e.vy += (this.y - e.y) * 0.015;
                                    }
                                }
                            }
                            else if (this.role === 'chrono') {
                                // Chrono: Slows enemies
                                const nearby = (frame + this.id) % 4 === 0 ? queryEntityGrid(this.x, this.y, 350) : [];
                                for (const e of nearby) {
                                    if (e.team !== this.team && !e.dead) {
                                        e.vx *= 0.6; e.vy *= 0.6;
                                    }
                                }
                            }
                            else if (this.role === 'builder') {
                                // Builder: Spawns static walls
                                if (this.builderCooldown > 0) this.builderCooldown--;
                                else if (entities.length < CONFIG.maxEntities) {
                                    const w = new NumberUnit(this.x, this.y, this.value * 2n);
                                    w.team = this.team; w.baseTeam = this.team;
                                    w.module = 'defense'; w.speedFactor = 0; // Static
                                    w.color = '#a8a29e';
                                    entities.push(w);
                                    this.builderCooldown = 300; // 5 seconds
                                }
                            }
                            else if (this.role === 'cannibal') {
                                // Cannibal: Eats friends if low HP
                                if (this.effVal < this.maxEffVal / 2n) {
                                    const friends = queryEntityGrid(this.x, this.y, 100);
                                    for (const f of friends) {
                                        if (f.team === this.team && f.role === 'worker' && !f.dead && f !== this) {
                                            f.die();
                                            this.effVal = this.maxEffVal; // Full heal
                                            this.damageMult = (this.damageMult || 1) * 1.1; // Power up
                                            particles.push(new Particle(this.x, this.y, '#ef4444', 5));
                                            break;
                                        }
                                    }
                                }
                            }
                            else if (this.role === 'ghost') {
                                // Ghost: Phases out
                                this.ghostTimer++;
                                if (this.ghostTimer % 300 > 180) {
                                    this.isEthereal = true;
                                } else {
                                    this.isEthereal = false;
                                }
                            }
                            else if (this.role === 'paramedic') {
                                // Paramedic: Heals critical allies (near 0 health)
                                let target = null;
                                if (this.paraTargetId) {
                                    target = entities.find(e => e.id === this.paraTargetId && !e.dead && e.team === this.team);
                                    // If target healed or dead, reset
                                    if (!target || (Number(target.effVal)/Number(target.maxEffVal) > 0.9)) {
                                        this.paraTargetId = null; this.paraTimer = 0; target = null;
                                    }
                                }
                                if (!target) {
                                    // Find new patient with insane wounds (< 30% HP)
                                    const allies = queryEntityGrid(this.x, this.y, 900);
                                    let best = null;
                                    let minHp = 0.3;
                                    for (const a of allies) {
                                        if (a.team === this.team && !a.dead && a !== this && !a.isDummy) {
                                            const ratio = Number(a.effVal) / Number(a.maxEffVal || 1n);
                                            if (ratio < minHp) { minHp = ratio; best = a; }
                                        }
                                    }
                                    if (best) this.paraTargetId = best.id;
                                }
                                
                                if (target) {
                                    const d = Math.hypot(target.x - this.x, target.y - this.y);
                                    if (d < this.radius + target.radius + 15) {
                                        this.paraTimer++;
                                        this.vx *= 0.5; this.vy *= 0.5; // Stay still
                                        target.vx *= 0.8; target.vy *= 0.8; // Patient stays still
                                        
                                        // Visuals: Tools & Surgery
                                        if (frame % 5 === 0 && !FX.lowFx) {
                                            particles.push(new Particle(this.x, this.y, '#ef4444', 2));
                                            particles.push(new Particle(target.x, target.y, '#ffffff', 1.5));
                                        }
                                        
                                        if (this.paraTimer > 600) { // 10 seconds to resurrect/heal
                                            target.effVal = target.maxEffVal; // Full restore
                                            target.setBigValue(target.value); // Refresh stats
                                            this.paraTimer = 0; this.paraTargetId = null;
                                            for(let i=0; i<15; i++) particles.push(new Particle(target.x, target.y, '#22c55e', 4));
                                        }
                                    } else {
                                        this.vx += (target.x - this.x) * 0.015;
                                        this.vy += (target.y - this.y) * 0.015;
                                        this.paraTimer = 0;
                                    }
                                }
                            }
                            else if (this.role === 'juggernaut') {
                                // Juggernaut: Slow relentless march
                                const enemyTeam = this.team === 'even' ? 'odd' : 'even';
                                const target = baseCenter(enemyTeam);
                                this.vx += (target.x - this.x) * 0.003;
                                this.vy += (target.y - this.y) * 0.003;
                            }
                            else if (this.role === 'shapeshifter') {
                                // Shapeshifter: Changes module every 5 seconds
                                if ((frame + this.id) % 300 === 0) {
                                    const mods = ['attack', 'defense', 'support', 'swarm', 'shield', 'trans', 'havoc', 'berserk'];
                                    this.module = mods[Math.floor(Math.random() * mods.length)];
                                    applyModule(this);
                                    particles.push(new Particle(this.x, this.y, '#ffffff', 3));
                                }
                            }
                            else if (this.role === 'graviton') {
                                // Graviton: Pushes enemies away (Reverse Void)
                                const nearby = (frame + this.id) % 3 === 0 ? queryEntityGrid(this.x, this.y, 350) : [];
                                for (const e of nearby) {
                                    if (e.team !== this.team && !e.dead && !e.isDummy) {
                                        e.vx -= (this.x - e.x) * 0.02;
                                        e.vy -= (this.y - e.y) * 0.02;
                                    }
                                }
                            }
                            else if (this.role === 'warp') {
                                // Warp: Teleports towards enemies
                                if ((frame + this.id) % 120 === 0 && bestTarget) {
                                    const angle = Math.atan2(bestTarget.y - this.y, bestTarget.x - this.x);
                                    this.x += Math.cos(angle) * 150;
                                    this.y += Math.sin(angle) * 150;
                                    particles.push(new Particle(this.x, this.y, '#8b5cf6', 4));
                                }
                            }
                            else if (this.role === 'refractor') {
                                // Refractor: Bursts projectiles
                                if ((frame + this.id) % 90 === 0) {
                                    for(let i=0; i<3; i++) {
                                        const a = (frame * 0.1) + (i * Math.PI * 2 / 3);
                                        projectiles.push(new FactorProjectile(this.x, this.y, this.value, a, this.team, 40));
                                    }
                                }
                            }
                            else if (this.role === 'summoner') {
                                // Summoner: Spawns minions
                                if ((frame + this.id) % 300 === 0 && entities.length < CONFIG.maxEntities) {
                                    const u = new NumberUnit(this.x, this.y, 1n);
                                    u.team = this.team; u.baseTeam = this.team;
                                    u.color = '#fbbf24'; // Minion color
                                    entities.push(u); assignSquad(u);
                                }
                            }
                            else if (this.role === 'prophet') {
                                // Prophet: Buffs evasion of allies
                                if ((frame + this.id) % 60 === 0) {
                                    const allies = queryEntityGrid(this.x, this.y, 300);
                                    for (const a of allies) {
                                        if (a.team === this.team && !a.dead) {
                                            a.evasion = Math.min(0.8, (a.evasion || 0) + 0.1);
                                            if(Math.random() < 0.1) particles.push(new Particle(a.x, a.y, '#fcd34d', 2));
                                        }
                                    }
                                }
                            }
                            else if (this.role === 'bomber') {
                                // Bomber: Fires explosive rounds
                                if ((frame + this.id) % 120 === 0 && bestTarget) {
                                    const a = Math.atan2(bestTarget.y - this.y, bestTarget.x - this.x);
                                    projectiles.push(new ExplodingBulletProjectile(this.x, this.y, this.value * 2n, a, this.team, 80));
                                }
                            }
                            else if (this.role === 'corruptor') {
                                // Corruptor: Spawns hazards
                                if ((frame + this.id) % 400 === 0) {
                                    hazards.push(new MultipleHazard(this.x, this.y, this.value, this.team));
                                }
                            }
                            else if (this.role === 'illusionist') {
                                // Illusionist: Spawns decoys
                                if ((frame + this.id) % 240 === 0 && entities.length < CONFIG.maxEntities) {
                                    const u = new NumberUnit(this.x + (Math.random()-0.5)*50, this.y + (Math.random()-0.5)*50, this.value, false, false, true, this.team);
                                    u.dummyType = 'decoy';
                                    entities.push(u);
                                }
                            }
                            // Thief logic is handled in collision to steal value
                            
                            // Lifegiver Module Logic
                            if (this.module === 'lifegiver' && this.livesLeft > 0 && frame % 30 === 0) {
                                const allies = queryEntityGrid(this.x, this.y, 350);
                                for (const a of allies) {
                                    if (a.team === this.team && !a.dead && a !== this && !a.isDummy) {
                                        if ((a.livesLeft || 0) < (a.livesMax || 1)) {
                                            a.livesLeft = (a.livesLeft || 0) + 1;
                                            this.livesLeft--;
                                            particles.push(new Particle(this.x, this.y, '#f43f5e', 4));
                                            particles.push(new Particle(a.x, a.y, '#f43f5e', 4));
                                            if (this.livesLeft <= 0) { this.die(); return; }
                                            break; 
                                        }
                                    }
                                }
                            }

                            // Berserk Module Logic
                            if (this.module === 'berserk') {
                                const stacks = this.berserkStacks || 0;
                                // Base cooldown 60, reduces by 2 per kill, min 5 frames
                                const cd = Math.max(5, 60 - stacks * 2);
                                if ((frame + this.id) % cd === 0) {
                                    const target = bestTarget;
                                    if (target) {
                                        const a = Math.atan2(target.y - this.y, target.x - this.x);
                                        projectiles.push(new FactorProjectile(this.x, this.y, this.value, a, this.team, 60));
                                    }
                                }
                            }

                            // Plague Effect (Damage over time)
                            if (this.infected) {
                                if (frame % 30 === 0) {
                                    this.value = this.value * 95n / 100n; // 5% decay
                                    this.setBigValue(this.value);
                                    particles.push(new Particle(this.x, this.y, '#10b981', 2));
                                    // Spread
                                    const nearby = queryEntityGrid(this.x, this.y, this.radius + 10);
                                    for (const e of nearby) {
                                        if (e !== this && !e.dead) e.infected = true;
                                    }
                                }
                            }

                            // Safety: cap velocity to prevent runaway speeds after boosts.
                            const cap = Math.max(12, 10 * speedMult);
                            const mag = Math.hypot(this.vx, this.vy);
                            if (mag > cap) {
                                const s = cap / mag;
                                this.vx *= s;
                                this.vy *= s;
                            }
                        }

                        this.x += this.vx; this.y += this.vy;
                        this.vx *= CONFIG.friction; this.vy *= CONFIG.friction;
                        // Post-friction nudge if we still ended up almost stopped.
                        const postMag = Math.abs(this.vx) + Math.abs(this.vy);
                        if (postMag < 0.08) {
                            const a = Math.random() * Math.PI * 2;
                            const n = 0.7;
                            this.vx += Math.cos(a) * n;
                            this.vy += Math.sin(a) * n;
                        }
                        if (this.x < 0 || this.x > CONFIG.worldSize) this.vx *= -1;
                        if (this.y < 0 || this.y > CONFIG.worldSize) this.vy *= -1;
                    }

                    die() {
                        if (this.dead || this.isReviving) return;
                        // Multi-life units: consume a life and respawn at base instead of dying.
                        if (!this.isDummy && (this.livesLeft || 1) > 1) {
                            this.livesLeft = Math.max(0, (this.livesLeft || 1) - 1);
                            this.isReviving = true;
                            this.reviveTimer = 90;
                            this.invulnTimer = 120;
                            const c = baseCenter(this.team);
                            this.x = c.x + (Math.random() - 0.5) * 220;
                            this.y = c.y + (Math.random() - 0.5) * 220;
                            this.vx = 0;
                            this.vy = 0;

                            const savedLives = this.livesLeft;
                            const tier = this.buffTier;
                            if (this.spawnValue) this.setBigValue(this.spawnValue, this.team);
                            else if (this.value <= 0n) this.setBigValue(100n, this.team);
                            if (tier) applyBuffTier(this, tier);
                            this.livesLeft = savedLives;

                            // Composite explosion on life loss
                            if (!this.isDummy && !this.isPrimeNum && this.value > 3n) {
                                this.spewProperFactorsAsUnits();
                            }

                            particles.push(new Particle(this.x, this.y, '#ffffff', 5));
                            return;
                        }

                        this.dead = true;
                        if (controlledUnit === this) controlledUnit = null;

                        if ((this.isLeader || this.isCommander) && this.squadId) {
                            SQUAD_RETREAT.set(this.squadId, 900);
                        }

                        // 2^n split tree: on death, release the full binary tree down to 2s.
                        spawnPowerOfTwoTreeSplits(this);

                        if (this.team === 'even' && !this.isDummy) {
                            for (let e of entities) {
                                if (e.dead || e.team === 'even') continue;
                                const d = Math.hypot(this.x - e.x, this.y - e.y);
                                if (d < 200) {
                                    e.value -= this.value / 2n;
                                    if (e.value <= 0n) e.die();
                                    else e.setBigValue(e.value);
                                }
                            }
                            for (let i = 0; i < 30; i++) particles.push(new Particle(this.x, this.y, '#ffffff', 5));
                        }

                        if (!this.isDummy && !this.isPrimeNum && this.value > 3n) {
                            // Composite death: spew all proper factors (not itself).
                            this.spewProperFactorsAsUnits();
                        }

                        // Bad Dummy Logic: If it's a "bait" dummy, it leaves no corpse and gives no knowledge.
                        if (this.isDummy && this.dummyType === 'bait') {
                            return; // Simply vanish
                        }

                        // Kamikaze Logic: Explode on death
                        if (this.role === 'kamikaze') {
                            // 90% chance to explode, 10% chance to dud
                            if (Math.random() < 0.9) {
                                projectiles.push(new ExplodingBulletProjectile(this.x, this.y, this.value * 8n, 0, this.team, 1));
                                minimapFlashes.push({x: this.x, y: this.y, r: 150, life: 45, maxLife: 45, color: 'rgba(239, 68, 68, 0.8)'});
                            }
                        }

                        if (this.role === 'ballistic-kamikaze') {
                            logToAiPanel(`[BOOM] Ballistic Kamikaze ${formatBigIntCompact(this.value)} DETONATED`);
                            // 1. Factors (Medium term)
                            const factors = this.getAllProperFactors();
                            const facts = factors.slice(0, 150);
                            facts.forEach(f => {
                                projectiles.push(new FactorProjectile(this.x, this.y, f, Math.random() * Math.PI * 2, this.team, 300));
                            });

                            // 2. Kill Zone (Long term, small area)
                            hazards.push(new MultipleHazard(this.x, this.y, this.value * 5n, this.team));
                            minimapFlashes.push({x: this.x, y: this.y, r: 300, life: 60, maxLife: 60, color: 'rgba(249, 115, 22, 0.8)'});

                            // 3. Short term projectiles (Scatter, fast, high damage)
                            for (let i = 0; i < 24; i++) {
                                const a = Math.random() * Math.PI * 2;
                                const p = new FactorProjectile(this.x, this.y, this.value * 20n, a, this.team, 45);
                                p.vx = Math.cos(a) * 25;
                                p.vy = Math.sin(a) * 25;
                                projectiles.push(p);
                            }
                        }

                        if (!this.isDummy && !this.isLeader && !this.isCommander) corpses.push(new Corpse(this.x, this.y, this.value, this.team));
                        if (this.isPrimeNum && !this.isDummy) {
                            if (this.isHappyNum) {
                                // Happy: Square of projectiles (hundreds), short term
                                const count = FX.lowFx ? 32 : 100;
                                for (let i = 0; i < count; i++) {
                                    const p = (i / count) * 8; // Perimeter position (4 sides * 2 length)
                                    let dx, dy;
                                    if (p < 2) { dx = -1 + p; dy = -1; } // Top
                                    else if (p < 4) { dx = 1; dy = -1 + (p - 2); } // Right
                                    else if (p < 6) { dx = 1 - (p - 4); dy = 1; } // Bottom
                                    else { dx = -1; dy = 1 - (p - 6); } // Left
                                    
                                    const angle = Math.atan2(dy, dx);
                                    projectiles.push(new FactorProjectile(this.x, this.y, this.value, angle, this.team, 45));
                                }
                            } else {
                                // Unhappy: Less projectiles, long term
                                const count = 8;
                                for (let i = 0; i < count; i++) {
                                    projectiles.push(new FactorProjectile(this.x, this.y, this.value, (i / count) * Math.PI * 2, this.team, 600));
                                }
                            }
                        }
                        for (let i = 0; i < 15; i++) particles.push(new Particle(this.x, this.y, this.color));
                    }

                    draw(ctx) {
                        const sx = (this.x - camera.x) * camera.zoom + width / 2, sy = (this.y - camera.y) * camera.zoom + height / 2;
                        let r = this.radius * camera.zoom;
                        if (sx < -r * 2 || sx > width + r * 2 || sy < -r * 2 || sy > height + r * 2) return;
                        if (FX.drawDist && Math.hypot(this.x - camera.x, this.y - camera.y) > FX.drawDist) return;

                        // LOD: Simple draw for high counts or zoomed out
                        if (entities.length > 8000 || camera.zoom < 0.3) {
                            ctx.fillStyle = this.color;
                            ctx.fillRect(sx, sy, 3, 3);
                            return;
                        }

                        // Buff rings
                        if (FX.showRings && !this.isDummy && this.buffTier && this.buffTier !== 'normal') {
                            // Draw rings only when not too crowded (performance).
                            if (entities.length > 1400) {
                                // skip
                            } else {
                                ctx.save();
                                ctx.lineWidth = 2 * camera.zoom;
                                const baseR = Math.max(0.1, r * 1.2);
                                if (this.buffTier === 'super') {
                                    const colors = ['#ef4444', '#22c55e', '#3b82f6']; // red, green, blue
                                    for (let i = 0; i < 3; i++) {
                                        ctx.strokeStyle = colors[i];
                                        ctx.beginPath();
                                        ctx.arc(sx, sy, baseR + i * 6 * camera.zoom, 0, Math.PI * 2);
                                        ctx.stroke();
                                    }
                                } else if (this.buffTier === 'mega') {
                                    for (let i = 0; i < 5; i++) {
                                        const hue1 = (frame * 6 + i * 60) % 360;
                                        ctx.strokeStyle = `hsl(${hue1} 100% 60%)`;
                                        ctx.beginPath();
                                        ctx.arc(sx, sy, baseR + i * 6 * camera.zoom, 0, Math.PI * 2);
                                        ctx.stroke();
                                    }
                                } else if (this.buffTier === 'ultra') {
                                    for (let i = 0; i < 10; i++) {
                                        const hue2 = (frame * 10 + i * 36) % 360;
                                        ctx.strokeStyle = `hsl(${hue2} 100% 55%)`;
                                        ctx.beginPath();
                                        ctx.arc(sx, sy, baseR + i * 5 * camera.zoom, 0, Math.PI * 2);
                                        ctx.stroke();
                                    }
                                }
                                // special spaced curve ring
                                ctx.lineWidth = 3 * camera.zoom;
                                ctx.setLineDash([8 * camera.zoom, 12 * camera.zoom]);
                                ctx.strokeStyle = `hsl(${(frame * 4) % 360} 100% 70%)`;
                                ctx.beginPath();
                                ctx.arc(sx, sy, baseR + 60 * camera.zoom, 0, Math.PI * 2);
                                ctx.stroke();
                                ctx.setLineDash([]);
                            }
                            ctx.restore();
                        }

                        if (this.isReviving) {
                            ctx.beginPath();
                            ctx.arc(sx, sy, r * 1.5, 0, Math.PI * 2);
                            ctx.strokeStyle = '#4ade80';
                            ctx.lineWidth = 3 * camera.zoom;
                            ctx.setLineDash([2, 2]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }

                        if (this.isSupporting && this.supportLineTarget && !this.supportLineTarget.dead) {
                            const tx = (this.supportLineTarget.x - camera.x) * camera.zoom + width / 2;
                            const ty = (this.supportLineTarget.y - camera.y) * camera.zoom + height / 2;
                            ctx.beginPath();
                            ctx.moveTo(sx, sy);
                            ctx.lineTo(tx, ty);
                            ctx.strokeStyle = '#4ade80';
                            ctx.lineWidth = 2 * camera.zoom;
                            ctx.setLineDash([5, 5]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }

                        if (this.isMultiplier) {
                            ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.1, r * 1.4), 0, Math.PI * 2);
                            ctx.strokeStyle = CONFIG.colors.hazard; ctx.lineWidth = 1 * camera.zoom;
                            ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                        }

                        // Spy Disguise Logic
                        let drawColor = this.color;
                        if (this.role === 'spy') {
                            drawColor = (this.team === 'even' ? CONFIG.colors.odd : CONFIG.colors.even);
                        }

                        if (this.isEthereal) {
                            ctx.globalAlpha = 0.4;
                        }
                        if (this.infected) drawColor = '#10b981';

                        ctx.fillStyle = '#0a0a0a'; ctx.strokeStyle = drawColor; ctx.lineWidth = (controlledUnit === this ? 5 : 2) * camera.zoom;
                        ctx.beginPath();
                        if (this.team === 'even') ctx.arc(sx, sy, Math.max(0.1, r), 0, Math.PI * 2);
                        else {
                            for (let i = 0; i < 3; i++) {
                                const a = (i / 3) * Math.PI * 2;
                                ctx[i === 0 ? 'moveTo' : 'lineTo'](sx + Math.cos(a) * r, sy + Math.sin(a) * r);
                            }
                            ctx.closePath();
                        }
                        ctx.fill(); ctx.stroke();
                        ctx.globalAlpha = 1.0;

                        if (this.isDummy) {
                            ctx.setLineDash([2, 2]); ctx.strokeStyle = 'white'; ctx.stroke(); ctx.setLineDash([]);
                        }

                        // Role glyphs (distinct silhouettes)
                        if (this.role && this.role !== 'worker') {
                            ctx.save();
                            ctx.lineWidth = 2 * camera.zoom;
                            if (this.role === 'leader') {
                                ctx.strokeStyle = '#f97316';
                                const outer = r * 1.6, inner = r * 0.8;
                                ctx.beginPath();
                                for (let i = 0; i < 5; i++) {
                                    const a = (Math.PI * 2 * i) / 5 - Math.PI / 2;
                                    const ax = sx + Math.cos(a) * outer;
                                    const ay = sy + Math.sin(a) * outer;
                                    const b = a + Math.PI / 5;
                                    const bx = sx + Math.cos(b) * inner;
                                    const by = sy + Math.sin(b) * inner;
                                    if (i === 0) ctx.moveTo(ax, ay);
                                    else ctx.lineTo(ax, ay);
                                    ctx.lineTo(bx, by);
                                }
                                ctx.closePath();
                                ctx.stroke();
                            } else if (this.role === 'commander') {
                                ctx.strokeStyle = '#93c5fd';
                                ctx.beginPath();
                                ctx.moveTo(sx, sy - r * 1.6);
                                ctx.lineTo(sx + r * 1.6, sy);
                                ctx.lineTo(sx, sy + r * 1.6);
                                ctx.lineTo(sx - r * 1.6, sy);
                                ctx.closePath();
                                ctx.stroke();
                            } else if (this.role === 'dummy-placer') {
                                ctx.strokeStyle = '#f472b6';
                                const rr = r * 1.4;
                                ctx.beginPath();
                                ctx.rect(sx - rr, sy - rr, rr * 2, rr * 2);
                                ctx.stroke();
                                ctx.beginPath();
                                ctx.moveTo(sx - rr, sy - rr);

                            entities.push(u);
                        }
                        logToAiPanel(`[DIRECTOR] Deployed ${team.toUpperCase()} Dummies`);
                    } else if (action === 'storm') {
                        if (storms.length < 3) {
                            storms.push(new Storm(Math.random() * CONFIG.worldSize, Math.random() * CONFIG.worldSize));
                            logToAiPanel(`[DIRECTOR] Summoned STORM`);
                        }
                    } else if (action === 'warp') {
                        SIM.timeScale = 0.5 + Math.random() * 1.5;
                        if (timescaleSlider) timescaleSlider.value = String(SIM.timeScale);
                        syncHud();
                        logToAiPanel(`[DIRECTOR] Time Warp: ${SIM.timeScale.toFixed(1)}x`);
                    }
                }

                function toggleLeaderboard() {
                    const p = document.getElementById('leaderboard-panel');
                    if (p) p.classList.toggle('collapsed');
                    const icon = document.getElementById('lb-toggle-icon');
                    if (icon) icon.classList.toggle('rotated');
                }
                window.toggleLeaderboard = toggleLeaderboard;

                function updateLeaderboardUI() {
                    const p = document.getElementById('leaderboard-panel');
                    if (!p) return;
                    if (p.classList.contains('hidden')) p.classList.remove('hidden');
                    if (p.classList.contains('collapsed')) return;

                    const content = document.getElementById('lb-content');
                    if (!content) return;

                    const getRoleName = (u) => {
                        if (u.role !== 'worker') return u.role.toUpperCase();
                        if (u.module === 'attack') return 'ATTACKER';
                        if (u.module === 'defense') return 'DEFENDER';
                        if (u.module) return u.module.toUpperCase();
                        return 'WORKER';
                    };

                    // Get top killers (Live units only)
                    const killers = entities.filter(e => !e.dead && !e.isDummy).sort((a, b) => (b.kills || 0) - (a.kills || 0)).slice(0, 100);
                    // Get oldest (Live units only)
                    const elders = entities.filter(e => !e.dead && !e.isDummy).sort((a, b) => b.age - a.age).slice(0, 100);

                    let html = '';
                    
                    html += `<div class="text-gray-400 font-bold border-b border-white/5 pb-1 mb-1">TOP KILLERS</div>`;
                    if (killers.length === 0) html += `<div class="text-gray-600 italic">No units</div>`;
                    killers.forEach((u, i) => {
                        const col = u.team === 'even' ? 'text-cyan-400' : 'text-fuchsia-400';
                        html += `<div class="flex justify-between"><span>${i+1}. <span class="${col}">${u.value}</span> <span class="text-[8px] text-gray-500">(${getRoleName(u)})</span></span> <span class="text-white">${u.kills || 0}</span></div>`;
                    });

                    html += `<div class="text-gray-400 font-bold border-b border-white/5 pb-1 mb-1 mt-2">LONGEST SURVIVED</div>`;
                    if (elders.length === 0) html += `<div class="text-gray-600 italic">No units</div>`;
                    elders.forEach((u, i) => {
                        const col = u.team === 'even' ? 'text-cyan-400' : 'text-fuchsia-400';
                        const time = (u.age / 60).toFixed(1) + 's';
                        html += `<div class="flex justify-between"><span>${i+1}. <span class="${col}">${u.value}</span> <span class="text-[8px] text-gray-500">(${getRoleName(u)})</span></span> <span class="text-gray-300">${time}</span></div>`;
                    });

                    content.innerHTML = html;
                }

                // Default player starts on even side with a mega unit (and reseeds if missing).
                function ensurePlayerSeed() {
                    if (playerSeeded) return;
                    const c = { x: CONFIG.worldSize / 2, y: CONFIG.worldSize / 2 };
                    const hero = new NumberUnit(c.x, c.y, 2_000_000n);
                    applyBuffTier(hero, 'mega');
                    hero.baseTeam = 'even';
                    hero.team = 'even';
                    controlledUnit = hero;
                    camera.x = hero.x;
                    camera.y = hero.y;
                    entities.push(hero);
                    playerSeeded = true;
                }

                function gameLoop() {
                    try {
                        const now = performance.now();
                        const rawDt = Math.min(0.1, (now - lastTime) / 1000);
                        lastTime = now;
                        if (rawDt > 0) fpsEma = fpsEma * 0.95 + (1 / rawDt) * 0.05;
                        const dt = rawDt * SIM.timeScale;
                        ROUND.clock += dt;
                        if (!playerSeeded) ensurePlayerSeed();

                        ctx.fillStyle = '#040404'; ctx.fillRect(0, 0, width, height);
                        const drawNow = !FX.headless;
                        if (drawNow) {
                            if (!FX.lowFx) drawWorldBorder();
                            if (TEAMS.enabled) {
                                drawBases();
                                for (const o of objectives) o.draw(ctx);
                            }
                        } else if (FX.headless) {
                            ctx.save();
                            ctx.fillStyle = 'rgba(255,255,255,0.35)';
                            ctx.font = 'bold 12px "JetBrains Mono"';
                            ctx.fillText('HEADLESS SIM (render minimized)', 24, 28);
                            ctx.restore();
                        }

                        const doTick = !SIM.paused || SIM.stepOnce;
                        if (!doTick) {
                            // Render-only frame.
                            if (drawNow) {
                                for (const c of corpses) c.draw(ctx);
                                for (const h of hazards) h.draw(ctx);
                                for (const s of storms) s.draw(ctx);
                                for (const o of objectives) o.draw(ctx);
                                for (const p of particles) p.draw(ctx);
                                for (const pr of projectiles) pr.draw(ctx);
                                for (const e of entities) e.draw(ctx);
                                drawDisasterEffect();
                            }
                            syncHud();
                            frame++;
                            requestAnimationFrame(gameLoop);
                            return;
                        }

                        rebuildEntityGrid();
                        rebuildEnemyCacheMaybe();

                        let updateStride = 1;
                        if (entities.length > 5000) updateStride = 2;
                        if (entities.length > 15000) updateStride = 4;
                        if (entities.length > 40000) updateStride = 8;

                        applyBaseWallDefense('even');
                        applyBaseWallDefense('odd');
                    if (entities.length < 5000 || frame % 2 === 0) {
                        turretUpdate('even', dt);
                        turretUpdate('odd', dt);
                    }

                        for (const o of objectives) o.update(dt);
                        if (frame % 90 === 0) { updateKnowledgeMultiplier('even'); updateKnowledgeMultiplier('odd'); }

                        // Base HP win condition + siege/repair.
                        for (const team of ['even', 'odd']) {
                    if (!TEAMS.enabled) break;
                            const baseSt = BASE_STATE[team];
                            if (!baseSt || baseSt.max <= 0n) continue;
                            if (baseSt.hp <= 0n) {
                                if (PAGE_MODE !== 'freeplay') endRound(team === 'even' ? 'odd' : 'even');
                                continue;
                            }

                            const r = baseRect(team);
                            const center = baseCenter(team);
                            const range = Math.max(r.w, r.h) / 2 + 200;
                            const candidates = queryEntityGrid(center.x, center.y, range);
                            let enemiesInside = 0;
                            for (const u of candidates) {
                                if (!u || u.dead || u.isDummy) continue;
                                if (u.team === team) continue;
                                if (!pointInRect(u.x, u.y, r)) continue;
                                enemiesInside++;
                            }

                            const wallUp = (WALL_STATE[team]?.hp || 0n) > 0n;
                            if (!wallUp && enemiesInside > 0) {
                                const perSec = 240000n; // base DPS per enemy (tuned for drama)
                                const dmg = (perSec * BigInt(enemiesInside) * BigInt(Math.max(1, Math.round(dt * 1000)))) / 1000n;
                                damageBase(team, dmg, center.x, center.y);
                            } else if (enemiesInside === 0) {
                                const healLvl = TEAM_UPGRADES[team]?.heal || 0;
                                if (healLvl > 0 && baseSt.hp < baseSt.max) {
                                    const regenPerSec = BigInt(140000 + healLvl * 120000);
                                    const heal = (regenPerSec * BigInt(Math.max(1, Math.round(dt * 1000)))) / 1000n;
                                    baseSt.hp = (baseSt.hp + heal) > baseSt.max ? baseSt.max : (baseSt.hp + heal);
                                }
                            }
                        }
                        forceWinIfStuck();
                        runDirector();
                        if (frame % 30 === 0) updateLeaderboardUI();

                        if (TEAMS.enabled && frame % 600 === 0 && storms.length < 2) {
                            storms.push(new Storm(Math.random() * CONFIG.worldSize, Math.random() * CONFIG.worldSize));
                        }

                        const rate = (spawnRateSlider && typeof spawnRateSlider.valueAsNumber === 'number')
                            ? spawnRateSlider.valueAsNumber
                            : (parseInt(spawnRateSlider?.value || "0", 10) || 0);
                        const fpsSpawnFactor = Math.max(0.35, Math.min(1, fpsEma / 90));

                        // Skip auto-spawn accumulation when over cap.
                        if (entities.length >= CONFIG.maxEntities) {
                            spawnAccumulator = 0;
                        }

                        // Bases are breeding grounds: spawn extra units inside each base (only when teams are on).
                        if (TEAMS.enabled && entities.length < CONFIG.maxEntities) {
                            const mv = spawnMaxValue();
                            if (!initialBaseBurstDone) {
                                // Small initial burst so bases don't start empty; scales with spawn upgrade.
                                const burstEven = Math.max(2, 2 + (TEAM_UPGRADES.even.spawn || 0));
                                const burstOdd = Math.max(2, 2 + (TEAM_UPGRADES.odd.spawn || 0));
                                for (let i = 0; i < burstEven && entities.length < CONFIG.maxEntities; i++) { spawnInBase('even', mv); spawnedTotal++; }
                                for (let i = 0; i < burstOdd && entities.length < CONFIG.maxEntities; i++) { spawnInBase('odd', mv); spawnedTotal++; }
                                initialBaseBurstDone = true;
                            }
                            const evenSpawnLvl = Math.min(10, TEAM_UPGRADES.even.spawn || 0);
                            const oddSpawnLvl = Math.min(10, TEAM_UPGRADES.odd.spawn || 0);
                            // No-upgrade spawners trickle: 30% of base rate; upgrades ramp linearly.
                            const evenSpawnMult = 0.30 + evenSpawnLvl * 0.40;
                            const oddSpawnMult = 0.30 + oddSpawnLvl * 0.40;
                            baseSpawnAccEven += dt * BASE_BREED_RATE * evenSpawnMult * fpsSpawnFactor;
                            baseSpawnAccOdd += dt * BASE_BREED_RATE * oddSpawnMult * fpsSpawnFactor;
                            while (baseSpawnAccEven >= 1 && entities.length < CONFIG.maxEntities) {
                                spawnInBase('even', mv);
                                spawnedTotal++;
                                baseSpawnAccEven--;
                            }
                            while (baseSpawnAccOdd >= 1 && entities.length < CONFIG.maxEntities) {
                                spawnInBase('odd', mv);
                                spawnedTotal++;
                                baseSpawnAccOdd--;
                            }
                        }

                        if (rate > 0 && entities.length < CONFIG.maxEntities) {
                            // Snapshot live counts once per frame to keep spawns balanced.
                            let evenLive = 0;
                            let oddLive = 0;
                            if (TEAMS.enabled) {
                                for (const e of entities) {
                                    if (e.dead || e.isDummy) continue;
                                    if (e.team === 'even') evenLive++;
                                    else if (e.team === 'odd') oddLive++;
                                }
                            }

                            spawnAccumulator += dt * rate * fpsSpawnFactor;
                            while (spawnAccumulator >= 1) {
                                const mv = spawnMaxValue();
                                // Safe random BigInt
                                const team = TEAMS.enabled ? pickSpawnTeamFromCounts(evenLive, oddLive) : null;
                                const randVal = generateSpawnValue(mv, team);
                                const viewW = width / Math.max(0.0001, camera.zoom);
                                const viewH = height / Math.max(0.0001, camera.zoom);
                                const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
                                const spawnX = clamp(camera.x + (randSpawn() - 0.5) * viewW, 0, CONFIG.worldSize);
                                const spawnY = clamp(camera.y + (randSpawn() - 0.5) * viewH, 0, CONFIG.worldSize);
                                const unit = new NumberUnit(spawnX, spawnY, randVal);
                                const tier = rollBuffTier();
                                applyBuffTier(unit, tier);
                                if (team) applySpawnUpgradeBias(unit, team, tier);
                                entities.push(unit);
                                assignSquad(unit);
                                if (team === 'even') evenLive++;
                                else if (team === 'odd') oddLive++;
                                spawnedTotal++;
                                spawnAccumulator--;
                            }
                        }

                        // drawNow computed earlier in loop.
                    const viewW = width / Math.max(0.1, camera.zoom);
                    const viewH = height / Math.max(0.1, camera.zoom);
                    const viewL = camera.x - viewW / 2 - 200;
                    const viewR = camera.x + viewW / 2 + 200;
                    const viewT = camera.y - viewH / 2 - 200;
                    const viewB = camera.y + viewH / 2 + 200;

                    corpses = corpses.filter(c => { if(drawNow && c.x>viewL && c.x<viewR && c.y>viewT && c.y<viewB) c.draw(ctx); c.update(); return c.life > 0; });
                    hazards = hazards.filter(h => { if(drawNow && h.x>viewL && h.x<viewR && h.y>viewT && h.y<viewB) h.draw(ctx); h.update(); return h.life > 0; });
                    storms = storms.filter(s => { if(drawNow) s.draw(ctx); s.update(); return s.life > 0; });
                    particles = particles.filter(p => { if(drawNow && p.x>viewL && p.x<viewR && p.y>viewT && p.y<viewB) p.draw(ctx); p.update(); return p.life > 0; });
                    projectiles = projectiles.filter(p => { if(drawNow && p.x>viewL && p.x<viewR && p.y>viewT && p.y<viewB) p.draw(ctx); p.update(); return p.life > 0; });
                    minimapFlashes = minimapFlashes.filter(f => f.life-- > 0);
                    
                    entities = entities.filter((e) => {
                        const inView = e.x > viewL && e.x < viewR && e.y > viewT && e.y < viewB;
                        // Update if in view (throttled) OR occasionally if out of view
                        const active = inView || (frame + e.id) % 120 === 0;
                        
                        if (active && (frame + e.id) % updateStride === 0) e.update();
                        if (drawNow && inView) e.draw(ctx);
                        
                        return !e.dead;
                    });

                        if (particles.length > FX.particleCap) particles.length = FX.particleCap;
                        if (projectiles.length > FX.projectileCap) projectiles.splice(0, projectiles.length - FX.projectileCap);
                        if (drawNow) drawDisasterEffect();
                        // Tick meetings down for leaders/commanders.
                        for (const lead of getSquadLeads()) {
                            if (lead.meetingTimer && lead.meetingTimer > 0) {
                                lead.meetingTimer--;
                                if (lead.meetingTimer === 0) applyMeetingBoost(lead);
                            }
                        }

                        for (const [sid, t] of SQUAD_RETREAT.entries()) {
                            if (t <= 1) SQUAD_RETREAT.delete(sid);
                            else SQUAD_RETREAT.set(sid, t - 1);
                        }

                        if (ROUND_END.active) {
                            if (!TEAMS.enabled) {
                                ROUND_END.active = false;
                                ROUND_END.winner = null;
                                ROUND_END.timer = 0;
                                if (winBanner) winBanner.classList.add('hidden');
                            } else {
                                ROUND_END.timer--;
                                if (winBannerSub) winBannerSub.innerText = `Next round in ${(Math.max(0, ROUND_END.timer) / 60).toFixed(1)}s`;
                                if (ROUND_END.timer <= 0) {
                                    ROUND_END.active = false;
                                    ROUND_END.winner = null;
                                    ROUND_END.timer = 0;
                                    ROUND.round += 1;
                                    if (winBanner) winBanner.classList.add('hidden');
                                    purgeField({ keepKnowledge: true });
                                }
                            }
                        }

                        // Keep a per-frame indicator so we can confirm the loop is running.
                        if (spawnDebug && frame % 10 === 0) {
                            spawnDebug.dataset.loop = 'running';
                        }

                        if (frame % 30 === 0) {
                            const ev = entities.filter(e => e.team === 'even' && !e.isDummy).length;
                            const od = entities.filter(e => e.team === 'odd' && !e.isDummy).length;
                            document.getElementById('score-even').innerText = ev; document.getElementById('score-odd').innerText = od;
                            document.getElementById('entity-counter').innerText = entities.length + ' UNITS';
                            if (spawnDebug) spawnDebug.innerText = `SPAWN: rate=${rate}/s total=${spawnedTotal} live=${entities.length}`;

                            if (gesturePanel) {
                                const show = !!controlledUnit && isLead(controlledUnit);
                                gesturePanel.classList.toggle('hidden', !show);
                                if (show && gestureActive) {
                                    const g = Number(controlledUnit.gesture || 0);
                                    gestureActive.textContent = `${g} ${GESTURES[g] || 'CLEAR'}`;
                                }
                                if (show && formationSelect) {
                                    formationSelect.value = controlledUnit.formation || 'default';
                                }
                            }

                            syncHud();

                            if (TEAMS.enabled && !ROUND_END.active && PAGE_MODE !== 'freeplay') {
                                if (ev === 0 && od > 0) endRound('odd');
                                if (od === 0 && ev > 0) endRound('even');
                            }

                            if (now - lastOverlayUpdate > 250) {
                                lastOverlayUpdate = now;
                                setDebugOverlay(`BUILD=${BUILD_ID} fps=${fpsEma.toFixed(0)} rate=${rate}/s total=${spawnedTotal} live=${entities.length}`);
                                document.title = `Big Int Field (${rate}/s total=${spawnedTotal} live=${entities.length})`;
                            }

                            // Detailed stats collection
                            const stats = {
                                evenRoles: {}, oddRoles: {},
                                evenTiers: {}, oddTiers: {}
                            };
                            entities.forEach(e => {
                                if (e.dead || e.isDummy) return;
                                const t = e.team;
                                if (t !== 'even' && t !== 'odd') return;
                                
                                let type = e.role;
                                if (type === 'worker' && e.module) type = e.module;
                                stats[t + 'Roles'][type] = (stats[t + 'Roles'][type] || 0) + 1;
                                
                                const tier = e.buffTier || 'normal';
                                stats[t + 'Tiers'][tier] = (stats[t + 'Tiers'][tier] || 0) + 1;
                            });

                            popHistory.even.push(ev); popHistory.odd.push(od);
                            popHistory.evenRoles.push(stats.evenRoles); popHistory.oddRoles.push(stats.oddRoles);
                            popHistory.evenTiers.push(stats.evenTiers); popHistory.oddTiers.push(stats.oddTiers);

                            if (popHistory.even.length > 100) { 
                                popHistory.even.shift(); popHistory.odd.shift(); 
                                popHistory.evenRoles.shift(); popHistory.oddRoles.shift();
                                popHistory.evenTiers.shift(); popHistory.oddTiers.shift();
                            }
                            mCtx.fillStyle = '#000'; mCtx.fillRect(0, 0, 180, 180);
                            const s = 180 / CONFIG.worldSize;
                            hazards.forEach(h => { mCtx.fillStyle = CONFIG.colors.hazard; mCtx.fillRect(h.x * s, h.y * s, 3, 3); });
                            storms.forEach(st => { mCtx.strokeStyle = 'rgba(168,85,247,0.8)'; mCtx.beginPath(); mCtx.arc(st.x * s, st.y * s, Math.max(2, st.r * s), 0, Math.PI * 2); mCtx.stroke(); });
                            minimapFlashes.forEach(f => {
                                mCtx.fillStyle = f.color;
                                mCtx.beginPath();
                                const p = 1 - f.life / f.maxLife;
                                mCtx.arc(f.x * s, f.y * s, Math.max(1, f.r * s * p), 0, Math.PI * 2);
                                mCtx.fill();
                            });
                            // Objectives + bases on minimap (very clear).
                            for (const o of objectives) {
                                mCtx.strokeStyle = o.owner === 'even' ? 'rgba(6,182,212,0.95)' : o.owner === 'odd' ? 'rgba(217,70,239,0.95)' : 'rgba(251,191,36,0.9)';
                                mCtx.beginPath();
                                mCtx.arc(o.x * s, o.y * s, Math.max(2, o.r * s), 0, Math.PI * 2);
                                mCtx.stroke();
                            }
                            for (const team of ['even', 'odd']) {
                                const r = baseRect(team);
                                mCtx.strokeStyle = team === 'even' ? 'rgba(6,182,212,0.9)' : 'rgba(217,70,239,0.9)';
                                mCtx.lineWidth = 1;
                                mCtx.strokeRect(r.x * s, r.y * s, r.w * s, r.h * s);
                            }

                            if (!FX.fogMinimap) {
                                entities.forEach(e => { mCtx.fillStyle = e.color; mCtx.fillRect(e.x * s, e.y * s, 2, 2); });
                            } else {
                                const vision = 900;
                                const viewerTeam = (controlledUnit && controlledUnit.team) ? controlledUnit.team : 'even';
                                const enemyTeam = viewerTeam === 'even' ? 'odd' : 'even';

                                // Friendlies always.
                                for (const e of entities) {
                                    if (!e || e.dead) continue;
                                    if (e.team !== viewerTeam) continue;
                                    mCtx.fillStyle = e.color;
                                    mCtx.fillRect(e.x * s, e.y * s, 2, 2);
                                }
                                // Enemies only if seen by any friendly.
                                for (const e of entities) {
                                    if (!e || e.dead) continue;
                                    if (e.team !== enemyTeam) continue;
                                    const near = queryEntityGrid(e.x, e.y, vision);
                                    const seen = near.some(n => n && !n.dead && n.team === viewerTeam && Math.hypot(n.x - e.x, n.y - e.y) <= vision);
                                    if (seen) {
                                        mCtx.fillStyle = e.color;
                                        mCtx.fillRect(e.x * s, e.y * s, 2, 2);
                                    }
                                }
                            }
                            gCtx.clearRect(0, 0, 200, 80); 
                            const m = Math.max(...popHistory.even, ...popHistory.odd, 100);
                            
                            if (graphMode === 'default') {
                                const dl = (h, c) => { gCtx.strokeStyle = c; gCtx.beginPath(); h.forEach((v, i) => gCtx[i === 0 ? 'moveTo' : 'lineTo']((i / 99) * 200, 80 - (v / m) * 70)); gCtx.stroke(); };
                                dl(popHistory.even, CONFIG.colors.even); dl(popHistory.odd, CONFIG.colors.odd);
                            } else {
                                const key = graphMode.replace('-', (graphMode.includes('roles') ? 'Roles' : 'Tiers'));
                                const history = popHistory[key];
                                if (history && history.length > 0) {
                                    const keys = new Set();
                                    let max = 10;
                                    history.forEach(step => {
                                        for (const k in step) {
                                            keys.add(k);
                                            if (step[k] > max) max = step[k];
                                        }
                                    });
                                    keys.forEach(k => {
                                        let col = stringToColor(k);
                                        if (graphMode.includes('tiers')) {
                                            if (k === 'normal') col = '#9ca3af';
                                            else if (k === 'super') col = '#f97316';
                                            else if (k === 'mega') col = '#a855f7';
                                            else if (k === 'ultra') col = '#3b82f6';
                                        }
                                        gCtx.strokeStyle = col;
                                        gCtx.beginPath();
                                        history.forEach((step, i) => {
                                            const v = step[k] || 0;
                                            const x = (i / 99) * 200;
                                            const y = 80 - (v / max) * 70;
                                            if (i === 0) gCtx.moveTo(x, y); else gCtx.lineTo(x, y);
                                        });
                                        gCtx.stroke();
                                    });
                                }
                            }
                        }
                        SIM.stepOnce = false;
                        frame++; requestAnimationFrame(gameLoop);
                    } catch (err) {
                        showRuntimeError(err);
                    }
                }

                canvas.addEventListener('mousedown', (e) => {
                    const mx = (e.clientX - width / 2) / camera.zoom + camera.x, my = (e.clientY - height / 2) / camera.zoom + camera.y;
                    const hits = entities
                        .filter(u => !u.dead && Math.hypot(mx - u.x, my - u.y) < (u.radius || CONFIG.fixedRadius) * 3.2)
                        .sort((a, b) => Math.hypot(mx - a.x, my - a.y) - Math.hypot(mx - b.x, my - b.y));
                    // Prefer selecting leaders/commanders if they are in range.
                    controlledUnit = hits.find(u => isLead(u)) || hits[0] || null;
                    if (!controlledUnit) { camera.isDragging = true; camera.lastMouseX = e.clientX; camera.lastMouseY = e.clientY; }
                });
                window.addEventListener('mouseup', () => camera.isDragging = false);
                canvas.addEventListener('mousemove', (e) => {
                    if (camera.isDragging && !controlledUnit) { camera.x -= (e.clientX - camera.lastMouseX) / camera.zoom; camera.y -= (e.clientY - camera.lastMouseY) / camera.zoom; camera.lastMouseX = e.clientX; camera.lastMouseY = e.clientY; }
                });
                const handleWheel = (e) => {
                    camera.zoom = Math.min(Math.max(camera.zoom - e.deltaY * 0.001, 0.1), 5.0);
                    e.preventDefault();
                };
                canvas.addEventListener('wheel', handleWheel, { passive: false });
                window.addEventListener('wheel', handleWheel, { passive: false });

                function toggleMasterPanel() {
                    document.getElementById('master-panel').classList.toggle('collapsed');
                    document.getElementById('toggle-panel').classList.toggle('rotated');
                }
                // index.html uses an inline onclick handler, so expose this globally.
                window.toggleMasterPanel = toggleMasterPanel;
                window.ToggleMasterPanel = toggleMasterPanel;

                document.getElementById('spawn-exact-btn').onclick = () => {
                    const valStr = exactValInput ? (exactValInput.value || "100") : "100";
                    const val = parseBigIntInput(valStr, 100n);
                    const qty = parseInt(document.getElementById('exact-qty').value || 1);
                    const tierSel = document.getElementById('exact-tier');
                    const tierChoice = (tierSel && tierSel.value) ? String(tierSel.value) : 'random';
                    const pickedTier = (tierChoice === 'random') ? rollBuffTier() : tierChoice;
                    const roleSel = document.getElementById('exact-role');
                    const roleChoice = (roleSel && roleSel.value) ? String(roleSel.value) : 'random';
                    for (let i = 0; i < qty; i++) {
                        const u = new NumberUnit(camera.x + (randSpawn() - 0.5) * 100, camera.y + (randSpawn() - 0.5) * 100, val);
                        forceRoleChoice(u, roleChoice);
                        applyBuffTier(u, pickedTier);
                        entities.push(u);
                        assignSquad(u);
                    }
                };
                document.getElementById('spawn-resistance-btn').onclick = () => { const u = new NumberUnit(camera.x, camera.y, 50000n, true); entities.push(u); assignSquad(u); };
                document.getElementById('spawn-cyclic-btn').onclick = () => { const u = new NumberUnit(camera.x, camera.y, 142857n); entities.push(u); assignSquad(u); };

                const directorBtn = document.getElementById('director-mode-btn');
                if (directorBtn) directorBtn.onclick = () => {
                    directorMode = !directorMode;
                    directorBtn.innerText = `DIRECTOR: ${directorMode ? 'ON' : 'OFF'}`;
                    directorBtn.style.borderColor = directorMode ? '#ef4444' : 'rgba(239, 68, 68, 0.3)';
                    directorBtn.style.color = directorMode ? '#ef4444' : '#f87171';
                    directorBtn.style.background = directorMode ? 'rgba(239, 68, 68, 0.1)' : 'transparent';
                    logToAiPanel(`[DIRECTOR] Mode ${directorMode ? 'ENGAGED' : 'DISENGAGED'}`);
                };

                function spawnParityUnit(team) {
                    const mvString = genValInput ? (genValInput.value || "2000000") : "2000000";
                    const mv = parseBigIntInput(mvString, 2000000n);
                    let randVal = BigInt(Math.floor(Math.random() * 1000000)) * mv / 1000000n + 1n;
                    randVal = adjustValueForTeam(randVal, team);
                    const u = new NumberUnit(camera.x + (randSpawn() - 0.5) * 120, camera.y + (randSpawn() - 0.5) * 120, randVal);
                    const tier = rollBuffTier();
                    applyBuffTier(u, tier);
                    if (TEAMS.enabled) applySpawnUpgradeBias(u, team, tier);
                    entities.push(u);
                    assignSquad(u);
                }

                document.getElementById('dummy-even-btn').onclick = () => {
                    if (PAGE_MODE === 'freeplay') { spawnParityUnit('even'); return; }
                    for (let i = 0; i < 3; i++) {
                        const u = new NumberUnit(camera.x + (randSpawn() - 0.5) * 200, camera.y + (randSpawn() - 0.5) * 200, 100n, false, false, true, 'even');
                        // 50% chance to be bait (bad dummy), 50% decoy (good dummy)
                        u.dummyType = Math.random() > 0.5 ? 'bait' : 'decoy';
                        entities.push(u);
                    }
                };
                document.getElementById('dummy-odd-btn').onclick = () => {
                    if (PAGE_MODE === 'freeplay') { spawnParityUnit('odd'); return; }
                    for (let i = 0; i < 3; i++) {
                        const u = new NumberUnit(camera.x + (randSpawn() - 0.5) * 200, camera.y + (randSpawn() - 0.5) * 200, 101n, false, false, true, 'odd');
                        u.dummyType = Math.random() > 0.5 ? 'bait' : 'decoy';
                        entities.push(u);
                    }
                };

                document.getElementById('reset-btn').onclick = () => purgeField({ keepKnowledge: true });
                document.getElementById('ai-analyze-btn').onclick = analyzeBattle;

                function updateSpawnRateDisplay() {
                    const v = parseInt(spawnRateSlider?.value || "0", 10) || 0;
                    if (rateDisplay) rateDisplay.innerText = v === 0 ? 'OFF' : `${v}/s`;
                }
                if (spawnRateSlider) {
                    spawnRateSlider.addEventListener('input', updateSpawnRateDisplay);
                    spawnRateSlider.addEventListener('change', updateSpawnRateDisplay);
                }
                updateSpawnRateDisplay();

                if (graphModeSelect) graphModeSelect.onchange = () => { graphMode = graphModeSelect.value; syncHud(); };

                gameLoop();
                if (earlyOverlay) earlyOverlay.textContent = `DEBUG: game.js started (${BUILD_ID})`;
            } catch (err) {
                try {
                    if (earlyOverlay) earlyOverlay.textContent = `DEBUG: game.js crashed: ${String(err && (err.message || err)).slice(0, 80)}`;
                } catch { }
                throw err;
            }
        })();
    </script>
</body>

</html>
