<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Universe Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        canvas {
            image-rendering: auto;
            cursor: crosshair;
        }
        .controls {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>

    <div class="controls p-4 border-b border-slate-700 flex flex-wrap items-center justify-between gap-4 z-10">
        <div class="flex items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-sky-400 leading-tight">Fractal Universe</h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-tighter">Extended Discrete Engine</p>
            </div>
            <select id="modeSelect" class="bg-slate-800 text-sm border border-slate-600 rounded px-3 py-1.5 focus:ring-2 focus:ring-sky-500 outline-none transition-all">
                <optgroup label="Path Systems" class="bg-slate-900">
                    <option value="peano">Peano Curve</option>
                    <option value="hilbert">Hilbert Curve</option>
                    <option value="dragon">Dragon Curve</option>
                    <option value="twindragon">Twindragon Curve</option>
                    <option value="terdragon">Terdragon Curve</option>
                    <option value="levy">Levy C Curve</option>
                    <option value="koch">Koch Snowflake</option>
                    <option value="quadratic_koch">Quadratic Koch</option>
                    <option value="cesaro">Cesaro Fractal</option>
                    <option value="minkowski">Minkowski Sausage</option>
                    <option value="gosper">Gosper Curve</option>
                    <option value="flowsnake">Flowsnake</option>
                </optgroup>
                <optgroup label="Recursive Shapes" class="bg-slate-900">
                    <option value="sierpinski_t">Sierpinski Triangle</option>
                    <option value="sierpinski_c">Sierpinski Carpet</option>
                    <option value="vicsek">Vicsek Fractal</option>
                    <option value="box">Box Fractal</option>
                    <option value="t_square">T-Square</option>
                    <option value="h_fractal">H-Fractal</option>
                    <option value="dendrite">Dendrite Fractal</option>
                    <option value="pythagorean">Pythagorean Tree</option>
                    <option value="apollonian">Apollonian Gasket</option>
                </optgroup>
                <optgroup label="L-Systems" class="bg-slate-900">
                    <option value="fern">Barnsley Fern</option>
                    <option value="bush">Bush</option>
                    <option value="fudgeflake">Fudgeflake</option>
                </optgroup>
                <optgroup label="Complex Dynamics" class="bg-slate-900">
                    <option value="mandelbrot">Mandelbrot Set</option>
                    <option value="julia">Julia Set</option>
                    <option value="burning_ship">Burning Ship</option>
                    <option value="newton">Newton Fractal</option>
                    <option value="phoenix">Phoenix Fractal</option>
                    <option value="mandelbox">Mandelbox (2D)</option>
                </optgroup>
                <optgroup label="1D Fractals" class="bg-slate-900">
                    <option value="cantor">Cantor Set</option>
                </optgroup>
            </select>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="flex flex-col">
                <label for="iterationRange" class="text-xs font-semibold mb-1 text-slate-300">Detail: <span id="iterVal" class="text-sky-400">4</span></label>
                <input type="range" id="iterationRange" min="1" max="15" value="4" 
                    class="w-48 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500">
            </div>
            
            <button id="resetBtn" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 rounded text-xs font-bold transition-colors shadow-lg shadow-sky-900/20">
                Reset View
            </button>
        </div>
    </div>

    <div class="relative flex-grow flex items-center justify-center bg-black overflow-hidden">
        <canvas id="mainCanvas"></canvas>
        <div class="absolute bottom-4 right-4 text-[10px] text-slate-500 pointer-events-none uppercase tracking-widest text-right leading-relaxed">
            Drag to Pan • Scroll to Zoom<br>
            <span id="statsInfo" class="font-mono text-sky-500"></span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const iterSlider = document.getElementById('iterationRange');
        const iterVal = document.getElementById('iterVal');
        const resetBtn = document.getElementById('resetBtn');
        const modeSelect = document.getElementById('modeSelect');
        const statsInfo = document.getElementById('statsInfo');

        let width, height;
        let iterations = parseInt(iterSlider.value);
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMousePos = { x: 0, y: 0 };
        let juliaC = { r: -0.7, i: 0.27015 };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight - 80;
            canvas.width = width;
            canvas.height = height;
            resetView();
        }

        function resetView() {
            const mode = modeSelect.value;
            offsetX = width / 2;
            offsetY = height / 2;
            
            if (mode === 'peano') scale = (Math.min(width, height) * 0.7) / Math.pow(3, iterations);
            else if (mode === 'hilbert') scale = (Math.min(width, height) * 0.8) / Math.pow(2, iterations);
            else if (mode === 'dragon') scale = (Math.min(width, height) * 0.5) / Math.pow(1.414, iterations);
            else if (mode === 'levy') scale = (Math.min(width, height) * 0.4);
            else if (mode === 'koch') scale = (Math.min(width, height) * 0.8);
            else if (mode === 'quadratic_koch') scale = (Math.min(width, height) * 0.8);
            else if (mode === 'fern') scale = height / 11;
            else if (mode === 'sierpinski_t' || mode === 'sierpinski_c' || mode === 'vicsek') 
                scale = (Math.min(width, height) * 0.8) / Math.pow(mode === 'sierpinski_t' ? 2 : 3, iterations);
            else if (['mandelbrot', 'julia', 'burning_ship', 'newton', 'phoenix', 'mandelbox'].includes(mode)) scale = Math.min(width, height) / 4;
            else if (mode === 'pythagorean') scale = height / 12;
            else if (mode === 't_square') scale = Math.min(width, height) * 0.4;
            else if (mode === 'box') scale = Math.min(width, height) * 0.3;
            else if (mode === 'h_fractal') scale = Math.min(width, height) * 0.4;
            else if (mode === 'dendrite') scale = height / 4;
            else if (mode === 'cantor') scale = width * 0.8;
            else if (mode === 'apollonian') scale = Math.min(width, height) * 0.45;
            else if (mode === 'gosper') scale = Math.min(width, height) * 0.5;
            else if (mode === 'terdragon') scale = Math.min(width, height) * 0.8;
            else if (mode === 'twindragon') scale = (Math.min(width, height) * 0.5) / Math.pow(1.414, iterations);
            else if (mode === 'cesaro') scale = Math.min(width, height) * 0.4;
            else if (mode === 'minkowski') scale = Math.min(width, height) * 0.8;
            else if (mode === 'fudgeflake') scale = Math.min(width, height) * 0.4;
            else if (mode === 'flowsnake') scale = Math.min(width, height) * 0.8;
            else if (mode === 'bush') scale = height / 2.5;

            if (mode === 'peano' || mode === 'sierpinski_c' || mode === 'vicsek' || mode === 'hilbert') {
                const b = (mode === 'hilbert' ? Math.pow(2, iterations) : Math.pow(3, iterations));
                const s = b * scale;
                offsetX -= s/2; offsetY -= s/2;
            } else if (mode === 'sierpinski_t') {
                const s = Math.pow(2, iterations) * scale;
                offsetX -= s/2; offsetY += (s * 0.866)/2;
            } else if (mode === 'pythagorean') {
                offsetY += height * 0.4;
            } else if (mode === 'dendrite' || mode === 'bush') {
                offsetY += height * 0.4;
            } else if (mode === 'koch' || mode === 'quadratic_koch') {
                offsetX -= scale/2; offsetY += scale/4;
            } else if (mode === 'fern') {
                offsetY += height/2.2;
            }
            draw();
        }

        function drawLine(x1, y1, x2, y2, color = '#a78bfa') {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        // --- HILBERT ---
        function drawHilbert() {
            let cx = offsetX + scale/2, cy = offsetY + scale/2;
            ctx.lineWidth = Math.max(1, scale * 0.8);
            function h(x, y, xi, xj, yi, yj, n) {
                if (n <= 0) return;
                h(x, y, yi/2, yj/2, xi/2, xj/2, n-1);
                let nx = cx + xi, ny = cy + xj; drawLine(cx, cy, nx, ny, '#fbbf24'); cx = nx; cy = ny;
                h(x + xi, y + xj, xi/2, xj/2, yi/2, yj/2, n-1);
                nx = cx + yi; ny = cy + yj; drawLine(cx, cy, nx, ny, '#fbbf24'); cx = nx; cy = ny;
                h(x + xi + yi, y + xj + yj, xi/2, xj/2, yi/2, yj/2, n-1);
                nx = cx - xi; ny = cy - xj; drawLine(cx, cy, nx, ny, '#fbbf24'); cx = nx; cy = ny;
                h(x + yi, y + yj, -yi/2, -yj/2, -xi/2, -xj/2, n-1);
            }
            h(0, 0, Math.pow(2, iterations-1)*scale, 0, 0, Math.pow(2, iterations-1)*scale, iterations);
        }

        // --- PEANO ---
        function drawPeano() {
            const step = scale;
            let cx = offsetX + step/2, cy = offsetY + step/2;
            ctx.lineWidth = Math.max(1, scale * 0.6);
            function p(n, id, jd, x, y) {
                if (n === 0) return;
                const s = Math.pow(3, n-1) * step;
                const stepX = (nx) => { drawLine(cx, cy, nx, cy); cx = nx; };
                const stepY = (ny) => { drawLine(cx, cy, cx, ny); cy = ny; };
                p(n-1, id, jd, x+(id<0?2*s:0), y+(jd<0?0:0)); stepX(cx+id*s);
                p(n-1, id, -jd, x+(id<0?s:s), y+(jd<0?0:0)); stepX(cx+id*s);
                p(n-1, id, jd, x+(id<0?0:2*s), y+(jd<0?0:0)); stepY(cy+jd*s);
                p(n-1, -id, jd, x+(id<0?0:2*s), y+(jd<0?s:s)); stepX(cx-id*s);
                p(n-1, -id, -jd, x+(id<0?s:s), y+(jd<0?s:s)); stepX(cx-id*s);
                p(n-1, -id, jd, x+(id<0?2*s:0), y+(jd<0?s:s)); stepY(cy+jd*s);
                p(n-1, id, jd, x+(id<0?2*s:0), y+(jd<0?2*s:2*s)); stepX(cx+id*s);
                p(n-1, id, -jd, x+(id<0?s:s), y+(jd<0?2*s:2*s)); stepX(cx+id*s);
                p(n-1, id, jd, x+(id<0?0:2*s), y+(jd<0?2*s:2*s));
            }
            p(iterations, 1, 1, offsetX, offsetY);
        }

        // --- DRAGON ---
        function drawDragon() {
            let cx = offsetX, cy = offsetY;
            let angle = 0;
            ctx.lineWidth = 1.5;
            function d(n, k) {
                if (n === 0) {
                    const nx = cx + Math.cos(angle) * scale;
                    const ny = cy + Math.sin(angle) * scale;
                    drawLine(cx, cy, nx, ny, '#f472b6');
                    cx = nx; cy = ny;
                    return;
                }
                if (k > 0) { d(n-1, 1); angle += Math.PI/2; d(n-1, -1); }
                else { d(n-1, 1); angle -= Math.PI/2; d(n-1, -1); }
            }
            d(iterations, 1);
        }

        // --- LEVY C ---
        function drawLevy() {
            ctx.lineWidth = 1.5;
            function l(x1, y1, x2, y2, n) {
                if (n === 0) { drawLine(x1, y1, x2, y2, '#e879f9'); return; }
                const mx = (x1 + x2) / 2 + (y2 - y1) / 2;
                const my = (y1 + y2) / 2 - (x2 - x1) / 2;
                l(x1, y1, mx, my, n-1);
                l(mx, my, x2, y2, n-1);
            }
            l(offsetX, offsetY, offsetX + scale * 1.5, offsetY, iterations);
        }

        // --- KOCH ---
        function drawKoch() {
            ctx.lineWidth = 1;
            function k(x1, y1, x2, y2, n) {
                if (n === 0) { drawLine(x1, y1, x2, y2, '#38bdf8'); return; }
                const dx = (x2 - x1) / 3, dy = (y2 - y1) / 3;
                const x3 = x1 + dx, y3 = y1 + dy;
                const x4 = x2 - dx, y4 = y2 - dy;
                const sin60 = 0.866025;
                const x5 = x3 + (dx * 0.5 - dy * sin60);
                const y5 = y3 + (dy * 0.5 + dx * sin60);
                k(x1, y1, x3, y3, n-1); k(x3, y3, x5, y5, n-1);
                k(x5, y5, x4, y4, n-1); k(x4, y4, x2, y2, n-1);
            }
            const h = scale * 0.866;
            k(offsetX, offsetY, offsetX + scale, offsetY, iterations);
            k(offsetX + scale, offsetY, offsetX + scale/2, offsetY - h, iterations);
            k(offsetX + scale/2, offsetY - h, offsetX, offsetY, iterations);
        }

        // --- VICSEK ---
        function drawVicsek(lvl) {
            const size = Math.pow(3, iterations);
            function v(x, y, s, n) {
                const ss = s * scale, sx = offsetX + x * scale, sy = offsetY + y * scale;
                if (n === 0 || ss < 1) { ctx.fillStyle = '#f87171'; ctx.fillRect(sx, sy, Math.max(1, ss), Math.max(1, ss)); return; }
                const ns = s / 3;
                v(x + ns, y, ns, n-1); v(x, y + ns, ns, n-1); v(x + ns, y + ns, ns, n-1); 
                v(x + 2*ns, y + ns, ns, n-1); v(x + ns, y + 2*ns, ns, n-1);
            }
            v(0, 0, size, lvl);
        }

        // --- FERN ---
        function drawFern() {
            let x = 0, y = 0; ctx.fillStyle = '#4ade80';
            for (let i = 0; i < iterations * 2000; i++) {
                let nx, ny, r = Math.random();
                if (r < 0.01) { nx = 0; ny = 0.16 * y; }
                else if (r < 0.86) { nx = 0.85 * x + 0.04 * y; ny = -0.04 * x + 0.85 * y + 1.6; }
                else if (r < 0.93) { nx = 0.2 * x - 0.26 * y; ny = 0.23 * x + 0.22 * y + 1.6; }
                else { nx = -0.15 * x + 0.28 * y; ny = 0.26 * x + 0.24 * y + 0.44; }
                x = nx; y = ny;
                const px = offsetX + x * scale, py = offsetY - y * scale;
                if (px > 0 && px < width && py > 0 && py < height) ctx.fillRect(px, py, 1, 1);
            }
        }

        // --- SIERPINSKI ---
        function drawSierpinskiTriangle(lvl) {
            const size = Math.pow(2, iterations);
            const hMult = 0.866;
            const drawT = (x, y, s, l) => {
                const sw = s * scale;
                const sx = offsetX + x * scale, sy = offsetY - (y + s * hMult) * scale;
                if (l === 0 || sw < 1) {
                    ctx.beginPath(); ctx.moveTo(sx, offsetY - y * scale); ctx.lineTo(sx + sw, offsetY - y * scale);
                    ctx.lineTo(sx + sw/2, sy); ctx.closePath(); ctx.fillStyle = '#4ade80'; ctx.fill(); return;
                }
                const ns = s / 2;
                drawT(x, y, ns, l-1); drawT(x + ns, y, ns, l-1); drawT(x + ns/2, y + ns * hMult, ns, l-1);
            };
            drawT(0, 0, size, lvl);
        }

        function drawSierpinskiCarpet(lvl) {
            const size = Math.pow(3, iterations);
            const drawC = (x, y, s, l) => {
                const ss = s * scale, sx = offsetX + x * scale, sy = offsetY + y * scale;
                if (l === 0 || ss < 1) { ctx.fillStyle = '#facc15'; ctx.fillRect(sx, sy, Math.max(1, ss), Math.max(1, ss)); return; }
                const ns = s / 3;
                for (let i=0; i<3; i++) for (let j=0; j<3; j++) if (i!==1 || j!==1) drawC(x+i*ns, y+j*ns, ns, l-1);
            };
            drawC(0, 0, size, lvl);
        }

        function drawComplexSet(t) {
            const imgData = ctx.createImageData(width, height), data = imgData.data;
            const max = Math.min(iterations, 500);
            for (let py = 0; py < height; py++) {
                const y0 = (py - offsetY) / scale;
                for (let px = 0; px < width; px++) {
                    const x0 = (px - offsetX) / scale;
                    let x = t==='julia'?x0:0, y = t==='julia'?y0:0;
                    let cx = t==='mandelbrot'?x0:juliaC.r, cy = t==='mandelbrot'?y0:juliaC.i, i = 0;
                    while (x*x + y*y <= 4 && i < max) { let xt = x*x - y*y + cx; y = 2*x*y + cy; x = xt; i++; }
                    const idx = (py * width + px) * 4;
                    if (i === max) { data[idx]=data[idx+1]=data[idx+2]=0; }
                    else { const [r, g, b] = hsvToRgb((i/max)*360+200, 0.8, 1); data[idx]=r; data[idx+1]=g; data[idx+2]=b; }
                    data[idx+3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function drawGosper() {
            let x = offsetX, y = offsetY;
            let angle = 0;
            const len = scale / Math.pow(2.645, iterations);
            ctx.lineWidth = 1.5;
            function gosperA(n) {
                if (n > 0) {
                    gosperA(n - 1); angle += Math.PI / 3;
                    gosperB(n - 1); angle -= 2 * Math.PI / 3;
                    gosperB(n - 1); angle += Math.PI / 3;
                    gosperA(n - 1);
                } else {
                    const nx = x + Math.cos(angle) * len;
                    const ny = y + Math.sin(angle) * len;
                    drawLine(x, y, nx, ny, '#f43f5e');
                    x = nx; y = ny;
                }
            }
            function gosperB(n) {
                if (n > 0) {
                    gosperB(n - 1); angle -= Math.PI / 3;
                    gosperA(n - 1); angle += 2 * Math.PI / 3;
                    gosperA(n - 1); angle -= Math.PI / 3;
                    gosperB(n - 1);
                } else {
                    const nx = x + Math.cos(angle) * len;
                    const ny = y + Math.sin(angle) * len;
                    drawLine(x, y, nx, ny, '#f43f5e');
                    x = nx; y = ny;
                }
            }
            gosperA(iterations);
        }

        function drawTerdragon() {
            let x = offsetX, y = offsetY;
            let angle = 0;
            const len = scale / Math.pow(1.732, iterations);
            ctx.lineWidth = 1.5;
            function ter(n) {
                if (n > 0) {
                    ter(n - 1); angle += 2 * Math.PI / 3;
                    ter(n - 1); angle -= 2 * Math.PI / 3;
                    ter(n - 1);
                } else {
                    const nx = x + Math.cos(angle) * len;
                    const ny = y + Math.sin(angle) * len;
                    drawLine(x, y, nx, ny, '#a78bfa');
                    x = nx; y = ny;
                }
            }
            ter(iterations);
        }

        function drawTwindragon() {
            let x = offsetX, y = offsetY;
            let angle = 0;
            const len = scale;
            ctx.lineWidth = 1.5;
            function dragon(n, sign) {
                if (n > 0) {
                    dragon(n - 1, 1);
                    angle += sign * Math.PI / 2;
                    dragon(n - 1, -1);
                } else {
                    const nx = x + Math.cos(angle) * len;
                    const ny = y + Math.sin(angle) * len;
                    drawLine(x, y, nx, ny, '#34d399');
                    x = nx; y = ny;
                }
            }
            dragon(iterations, 1);
            angle += Math.PI;
            dragon(iterations, 1);
        }

        function drawCesaro() {
            ctx.lineWidth = 1;
            const angle = (Math.random() - 0.5) * 0.5 + Math.PI / 2.1;
            function cesaro(x1, y1, x2, y2, n) {
                if (n === 0) { drawLine(x1, y1, x2, y2, '#fbbf24'); return; }
                const dx = x2 - x1, dy = y2 - y1;
                const x3 = x1 + dx / 2 - dy / (2 * Math.tan(angle));
                const y3 = y1 + dy / 2 + dx / (2 * Math.tan(angle));
                cesaro(x1, y1, x3, y3, n - 1);
                cesaro(x3, y3, x2, y2, n - 1);
            }
            const size = scale * 2;
            cesaro(offsetX - size/2, offsetY + size/4, offsetX + size/2, offsetY + size/4, iterations);
            cesaro(offsetX + size/2, offsetY + size/4, offsetX + size/2, offsetY - size/4, iterations);
            cesaro(offsetX + size/2, offsetY - size/4, offsetX - size/2, offsetY - size/4, iterations);
            cesaro(offsetX - size/2, offsetY - size/4, offsetX - size/2, offsetY + size/4, iterations);
        }

        function drawMinkowski() {
            ctx.lineWidth = 1;
            function mink(x1, y1, x2, y2, n) {
                if (n === 0) { drawLine(x1, y1, x2, y2, '#f472b6'); return; }
                const dx = (x2 - x1) / 4, dy = (y2 - y1) / 4;
                const p = [
                    {x: x1, y: y1}, {x: x1 + dx, y: y1 + dy},
                    {x: x1 + dx - dy, y: y1 + dy + dx}, {x: x1 + 2*dx - dy, y: y1 + 2*dy + dx},
                    {x: x1 + 2*dx, y: y1 + 2*dy}, {x: x1 + 3*dx, y: y1 + 3*dy},
                    {x: x1 + 3*dx + dy, y: y1 + 3*dy - dx}, {x: x1 + 2*dx + dy, y: y1 + 2*dy - dx},
                    {x: x2, y: y2}
                ];
                for (let i = 0; i < p.length - 1; i++) mink(p[i].x, p[i].y, p[i+1].x, p[i+1].y, n - 1);
            }
            mink(offsetX - scale, offsetY, offsetX + scale, offsetY, iterations);
        }

        function drawPythagoreanTree() {
            ctx.lineWidth = 1;
            function tree(x1, y1, x2, y2, n) {
                if (n === 0) return;
                const dx = x2 - x1, dy = y2 - y1;
                const x3 = x2 - dy, y3 = y2 + dx;
                const x4 = x1 - dy, y4 = y1 + dx;
                const x5 = x4 + 0.5 * (dx - dy);
                const y5 = y4 + 0.5 * (dy + dx);
                drawLine(x1, y1, x2, y2, '#84cc16'); drawLine(x2, y2, x3, y3, '#84cc16');
                drawLine(x3, y3, x4, y4, '#84cc16'); drawLine(x4, y4, x1, y1, '#84cc16');
                tree(x4, y4, x5, y5, n - 1); tree(x5, y5, x3, y3, n - 1);
            }
            tree(offsetX - scale/2, offsetY, offsetX + scale/2, offsetY, iterations);
        }

        function drawTSquare() {
            const size = scale;
            function tsquare(x, y, s, n) {
                if (n === 0 || s < 1) return;
                const hs = s / 2, qs = s / 4;
                ctx.fillStyle = '#22d3ee';
                ctx.fillRect(x - hs, y - hs, s, s);
                tsquare(x - qs, y - qs, hs, n - 1); tsquare(x + qs, y - qs, hs, n - 1);
                tsquare(x - qs, y + qs, hs, n - 1); tsquare(x + qs, y + qs, hs, n - 1);
            }
            tsquare(offsetX, offsetY, size, iterations);
        }

        function drawBoxFractal() {
            const size = scale;
            function box(x, y, s, n) {
                if (n === 0 || s < 1) return;
                const ns = s / 3;
                ctx.fillStyle = '#60a5fa';
                ctx.fillRect(x + ns, y + ns, ns, ns);
                if (n > 1) {
                    for (let i=0; i<3; i++) for (let j=0; j<3; j++) if (i!==1 || j!==1) box(x+i*ns, y+j*ns, ns, n-1);
                }
            }
            box(offsetX - size/2, offsetY - size/2, size, iterations);
        }

        function drawHFractal() {
            ctx.lineWidth = 1.5;
            function h(x, y, s, n) {
                if (n === 0) return;
                const hs = s / 2;
                drawLine(x - hs, y, x + hs, y, '#f43f5e');
                drawLine(x - hs, y - hs, x - hs, y + hs, '#f43f5e');
                drawLine(x + hs, y - hs, x + hs, y + hs, '#f43f5e');
                h(x - hs, y - hs, hs, n - 1); h(x - hs, y + hs, hs, n - 1);
                h(x + hs, y - hs, hs, n - 1); h(x + hs, y + hs, hs, n - 1);
            }
            h(offsetX, offsetY, scale * 2, iterations);
        }

        function drawDendrite() {
            ctx.lineWidth = 1;
            function dendrite(x, y, len, angle, n) {
                if (n === 0) return;
                const x2 = x + len * Math.cos(angle);
                const y2 = y + len * Math.sin(angle);
                drawLine(x, y, x2, y2, '#a3e635');
                dendrite(x2, y2, len * 0.7, angle - Math.PI / 4, n - 1);
                dendrite(x2, y2, len * 0.7, angle + Math.PI / 4, n - 1);
            }
            dendrite(offsetX, offsetY, scale, -Math.PI / 2, iterations);
        }

        function drawCantor() {
            ctx.lineWidth = scale;
            function cantor(x, y, len, n) {
                if (n === 0) return;
                drawLine(x, y, x + len, y, '#eab308');
                cantor(x, y + scale * 2, len / 3, n - 1);
                cantor(x + len * 2 / 3, y + scale * 2, len / 3, n - 1);
            }
            cantor(offsetX - scale * 10, offsetY, scale * 20, iterations);
        }

        function drawApollonian() {
            ctx.lineWidth = 1;
            function apollonian(x, y, r, n) {
                if (n === 0 || r < 1) return;
                ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
                ctx.strokeStyle = '#60a5fa'; ctx.stroke();
                const r2 = r / (1 + Math.sqrt(2));
                apollonian(x + r - r2, y, r2, n - 1); apollonian(x - r + r2, y, r2, n - 1);
                apollonian(x, y + r - r2, r2, n - 1); apollonian(x, y - r + r2, r2, n - 1);
            }
            apollonian(offsetX, offsetY, scale, iterations);
        }

        function drawQuadraticKoch() {
            ctx.lineWidth = 1;
            function qk(x1, y1, x2, y2, n) {
                if (n === 0) { drawLine(x1, y1, x2, y2, '#f472b6'); return; }
                const dx = (x2 - x1) / 3, dy = (y2 - y1) / 3;
                const p = [
                    {x: x1, y: y1}, {x: x1 + dx, y: y1 + dy},
                    {x: x1 + dx - dy, y: y1 + dy + dx}, {x: x1 + 2*dx - dy, y: y1 + 2*dy + dx},
                    {x: x1 + 2*dx, y: y1 + 2*dy}, {x: x2, y: y2}
                ];
                for (let i = 0; i < p.length - 1; i++) qk(p[i].x, p[i].y, p[i+1].x, p[i+1].y, n - 1);
            }
            qk(offsetX - scale, offsetY, offsetX + scale, offsetY, iterations);
        }

        function drawFudgeflake() {
            ctx.lineWidth = 1;
            function fudge(x, y, s, n) {
                if (n === 0) { drawLine(x, y, x + s, y, '#a78bfa'); return; }
                const ns = s / 3;
                fudge(x, y, ns, n - 1); fudge(x + 2*ns, y, ns, n - 1);
                fudge(x + ns, y, ns, n - 1); fudge(x + ns, y - ns, ns, n - 1);
            }
            const size = scale;
            for (let i = 0; i < 6; i++) {
                ctx.save(); ctx.translate(offsetX, offsetY);
                ctx.rotate(i * Math.PI / 3); fudge(-size/2, 0, size, iterations);
                ctx.restore();
            }
        }

        function drawFlowsnake() {
            let x = offsetX, y = offsetY;
            let angle = 0;
            const len = scale / Math.pow(Math.sqrt(7), iterations);
            ctx.lineWidth = 1;
            function flow(n, turn) {
                if (n === 0) {
                    const nx = x + Math.cos(angle) * len; const ny = y + Math.sin(angle) * len;
                    drawLine(x, y, nx, ny, '#34d399'); x = nx; y = ny; return;
                }
                angle += turn; flow(n - 1, -turn); angle -= turn; flow(n - 1, turn);
                angle -= turn; flow(n - 1, turn); angle += turn; flow(n - 1, -turn);
            }
            for (let i = 0; i < 3; i++) { flow(iterations, Math.PI / 3); angle -= 2 * Math.PI / 3; }
        }

        function drawBush() {
            ctx.lineWidth = 1;
            const len = scale;
            const angle = 25 * Math.PI / 180;
            function bush(n, l) {
                if (n === 0) return;
                drawLine(0, 0, 0, -l, '#84cc16');
                ctx.translate(0, -l);
                ctx.save(); ctx.rotate(angle); bush(n - 1, l * 0.6); ctx.restore();
                ctx.save(); ctx.rotate(-angle); bush(n - 1, l * 0.6); ctx.restore();
            }
            ctx.save(); ctx.translate(offsetX, offsetY); bush(iterations, len); ctx.restore();
        }

        function hsvToRgb(h, s, v) {
            let r, g, b, i = Math.floor(h/60), f = h/60-i, p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
            switch (i % 6) { case 0: r=v, g=t, b=p; break; case 1: r=q, g=v, b=p; break; case 2: r=p, g=v, b=t; break; case 3: r=p, g=q, b=v; break; case 4: r=t, g=p, b=v; break; case 5: r=v, g=p, b=q; break; }
            return [Math.round(r*255), Math.round(g*255), Math.round(b*255)];
        }

        function draw() {
            const start = performance.now();
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, width, height);
            const m = modeSelect.value;
            if (['mandelbrot', 'julia', 'burning_ship', 'newton', 'phoenix', 'mandelbox'].includes(m)) drawComplexSet(m);
            else if (m === 'peano') drawPeano();
            else if (m === 'hilbert') drawHilbert();
            else if (m === 'dragon') drawDragon();
            else if (m === 'levy') drawLevy();
            else if (m === 'koch') drawKoch();
            else if (m === 'fern') drawFern();
            else if (m === 'sierpinski_t') drawSierpinskiTriangle(iterations);
            else if (m === 'sierpinski_c') drawSierpinskiCarpet(iterations);
            else if (m === 'vicsek') drawVicsek(iterations);
            else if (m === 'gosper') drawGosper();
            else if (m === 'terdragon') drawTerdragon();
            else if (m === 'twindragon') drawTwindragon();
            else if (m === 'cesaro') drawCesaro();
            else if (m === 'minkowski') drawMinkowski();
            else if (m === 'pythagorean') drawPythagoreanTree();
            else if (m === 't_square') drawTSquare();
            else if (m === 'box') drawBoxFractal();
            else if (m === 'h_fractal') drawHFractal();
            else if (m === 'dendrite') drawDendrite();
            else if (m === 'cantor') drawCantor();
            else if (m === 'apollonian') drawApollonian();
            else if (m === 'quadratic_koch') drawQuadraticKoch();
            else if (m === 'fudgeflake') drawFudgeflake();
            else if (m === 'flowsnake') drawFlowsnake();
            else if (m === 'bush') drawBush();
            statsInfo.innerText = `${(performance.now() - start).toFixed(1)}ms | High Precision`;
        }

        modeSelect.addEventListener('change', () => {
            const m = modeSelect.value;
            if (m === 'peano') { iterSlider.max = 7; iterSlider.value = 4; }
            else if (m === 'hilbert') { iterSlider.max = 8; iterSlider.value = 5; }
            else if (m === 'dragon') { iterSlider.max = 16; iterSlider.value = 10; }
            else if (m === 'levy') { iterSlider.max = 18; iterSlider.value = 12; }
            else if (m === 'koch') { iterSlider.max = 8; iterSlider.value = 4; }
            else if (m === 'fern') { iterSlider.max = 50; iterSlider.value = 20; }
            else if (m === 'sierpinski_t' || m === 'sierpinski_c') { iterSlider.max = 8; iterSlider.value = 5; }
            else if (m === 'vicsek') { iterSlider.max = 8; iterSlider.value = 5; }
            else if (['pythagorean', 'h_fractal', 'dendrite', 'bush', 'apollonian', 'fudgeflake', 'flowsnake'].includes(m)) { iterSlider.max = 12; iterSlider.value = 8; }
            else if (['gosper', 'terdragon', 'twindragon', 'cesaro', 'minkowski', 'quadratic_koch', 'box', 't_square', 'cantor'].includes(m)) { iterSlider.max = 8; iterSlider.value = 4; }
            else { iterSlider.max = 1000; iterSlider.value = 100; }
            iterations = parseInt(iterSlider.value); iterVal.innerText = iterations; resetView();
        });

        iterSlider.addEventListener('input', (e) => { iterations = parseInt(e.target.value); iterVal.innerText = iterations; draw(); });
        resetBtn.addEventListener('click', resetView);
        canvas.addEventListener('mousedown', (e) => { isDragging = true; lastMousePos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => { if (!isDragging) return; offsetX += (e.clientX - lastMousePos.x); offsetY += (e.clientY - lastMousePos.y); lastMousePos = { x: e.clientX, y: e.clientY }; draw(); });
        window.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('wheel', (e) => { e.preventDefault(); const f = Math.exp(-e.deltaY * 0.001); const mx = e.clientX, my = e.clientY - 80; offsetX = mx - (mx - offsetX) * f; offsetY = my - (my - offsetY) * f; scale *= f; draw(); }, { passive: false });
        window.addEventListener('resize', resize); resize();
    </script>
</body>
