<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f18;
            --text: #f8fafc;
            --accent: #facc15;
            --panel: rgba(255, 255, 255, 0.08);
        }
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #70c5ce;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        button, .link-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 24px;
            border-radius: 99px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        button:hover, .link-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .link-btn {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <div class="controls">
        <button id="btn-action">Tap / Space to Flap</button>
        <a href="../index.html" class="link-btn">Back to Hub</a>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btnAction = document.getElementById('btn-action');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            fg.h = 112; // Reset floor height relative to new canvas
        }
        window.addEventListener('resize', resize);
        resize();

        // Game variables
        let frames = 0;
        const DEGREE = Math.PI / 180;

        // Game state
        const state = {
            current: 0,
            getReady: 0,
            game: 1,
            over: 2
        };

        // Game objects
        const bird = {
            x: 50,
            y: 150,
            radius: 12,
            speed: 0,
            gravity: 0.25,
            jump: 4.6,
            rotation: 0,
            gravityDir: 1, // 1 = down, -1 = up
            
            draw: function() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(1, this.gravityDir); // Flip bird if gravity is reversed
                
                // Body
                ctx.fillStyle = "#facc15";
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#000";
                ctx.stroke();

                // Eye
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(6, -6, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(8, -6, 2, 0, Math.PI*2);
                ctx.fill();

                // Wing
                ctx.fillStyle = "#eab308";
                ctx.beginPath();
                ctx.ellipse(-2, 4, 8, 5, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();

                // Beak
                ctx.fillStyle = "#f97316";
                ctx.beginPath();
                ctx.moveTo(8, 2);
                ctx.lineTo(16, 6);
                ctx.lineTo(8, 10);
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            },
            
            flap: function() {
                this.speed = -this.jump * this.gravityDir;
            },
            
            update: function() {
                // Hover animation in Get Ready state
                if(state.current == state.getReady) {
                    this.y = 150 + Math.cos(frames * 0.1) * 5;
                    this.rotation = 0 * DEGREE;
                } else {
                    this.speed += this.gravity * this.gravityDir;
                    this.y += this.speed;
                    
                    // Floor collision
                    if (this.gravityDir === 1) {
                        if(this.y + this.radius >= canvas.height - fg.h) {
                            this.y = canvas.height - fg.h - this.radius;
                            this.die();
                        }
                    } else {
                        // Ceiling collision (when gravity is reversed)
                        if(this.y - this.radius <= 0) {
                            this.y = this.radius;
                            this.die();
                        }
                    }
                    
                    // Rotation logic
                    // Adjust rotation based on direction of movement relative to gravity
                    let movingUp = (this.gravityDir === 1 && this.speed < 0) || (this.gravityDir === -1 && this.speed > 0);
                    
                    if(movingUp) {
                        this.rotation = -25 * DEGREE;
                    } else {
                        this.rotation += 5 * DEGREE;
                        this.rotation = Math.min(Math.PI/2, this.rotation);
                    }
                }
            },
            die: function() {
                if(state.current == state.game) {
                    state.current = state.over;
                    btnAction.textContent = "Tap to Restart";
                }
            },
            reset: function() {
                this.speed = 0;
                this.rotation = 0;
                this.y = 150;
                this.gravityDir = 1;
            }
        }

        const bg = {
            draw: function() {
                ctx.fillStyle = "#70c5ce";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Clouds
                ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
                ctx.beginPath();
                ctx.arc(50, 400, 40, 0, Math.PI*2);
                ctx.arc(100, 380, 50, 0, Math.PI*2);
                ctx.arc(160, 400, 40, 0, Math.PI*2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(250, 420, 40, 0, Math.PI*2);
                ctx.arc(300, 400, 50, 0, Math.PI*2);
                ctx.fill();
            }
        }

        const fg = {
            h: 112,
            draw: function() {
                ctx.fillStyle = "#ded895";
                
                // Draw ceiling if gravity reversed
                if (bird.gravityDir === -1) {
                    ctx.fillRect(0, 0, canvas.width, 20);
                }

                ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);
                
                // Grass top
                ctx.fillStyle = "#73bf2e";
                ctx.fillRect(0, canvas.height - this.h, canvas.width, 12);
                ctx.strokeStyle = "#558c22";
                ctx.beginPath();
                ctx.moveTo(0, canvas.height - this.h + 12);
                ctx.lineTo(canvas.width, canvas.height - this.h + 12);
                ctx.stroke();
            },
            update: function() {
                // Could add scrolling ground texture here
            }
        }

        const portals = {
            items: [],
            radius: 25,
            
            draw: function() {
                for(let i=0; i<this.items.length; i++) {
                    let p = this.items[i];
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(frames * 0.05);
                    
                    // Outer glow
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 5 + Math.sin(frames*0.1)*3, 0, Math.PI*2);
                    ctx.fillStyle = "rgba(168, 85, 247, 0.3)";
                    ctx.fill();

                    // Portal swirl
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                    ctx.strokeStyle = "#d8b4fe";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    
                    // Inner
                    ctx.beginPath();
                    ctx.arc(Math.cos(frames*0.2)*5, Math.sin(frames*0.2)*5, this.radius*0.6, 0, Math.PI*2);
                    ctx.fillStyle = "#7e22ce";
                    ctx.fill();
                    
                    ctx.restore();
                }
            },
            update: function() {
                if(state.current !== state.game) return;
                for(let i=0; i<this.items.length; i++) {
                    this.items[i].x -= pipes.dx;
                    if(this.items[i].x + this.radius < 0) {
                        this.items.shift();
                        i--;
                    }
                }
            },
            reset: function() { this.items = []; }
        }

        const pipes = {
            position: [],
            w: 52,
            gap: 140, // Increased gap slightly for better playability
            dx: 2,
            
            draw: function() {
                for(let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    let topY = p.y; // Bottom of top pipe
                    let bottomY = p.y + this.gap; // Top of bottom pipe
                    
                    // Top Pipe
                    ctx.fillStyle = "#73bf2e";
                    ctx.fillRect(p.x, 0, this.w, topY);
                    ctx.strokeStyle = "#000";
                    ctx.strokeRect(p.x, -2, this.w, topY+2); // Draw offscreen top
                    
                    // Cap
                    ctx.fillStyle = "#73bf2e";
                    ctx.fillRect(p.x - 2, topY - 24, this.w + 4, 24);
                    ctx.strokeRect(p.x - 2, topY - 24, this.w + 4, 24);
                    
                    // Bottom Pipe
                    ctx.fillStyle = "#73bf2e";
                    ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY - fg.h);
                    ctx.strokeRect(p.x, bottomY, this.w, canvas.height - bottomY - fg.h);
                    
                    // Cap
                    ctx.fillStyle = "#73bf2e";
                    ctx.fillRect(p.x - 2, bottomY, this.w + 4, 24);
                    ctx.strokeRect(p.x - 2, bottomY, this.w + 4, 24);
                }
            },
            
            update: function() {
                if(state.current !== state.game) return;
                
                // Add new pipe or portal
                if(frames % 120 == 0) {
                    // 15% chance to spawn a gravity portal instead of a pipe
                    if (Math.random() < 0.15 && frames > 200) {
                        portals.items.push({
                            x: canvas.width,
                            y: Math.random() * (canvas.height - fg.h - 100) + 50
                        });
                    } else {
                        // Calculate random position for gap
                        // Gap should be between 50px from top and 50px from floor
                        let minPipe = 50;
                        let maxPipe = canvas.height - fg.h - minPipe - this.gap;
                        this.position.push({
                            x: canvas.width,
                            y: Math.floor(Math.random() * (maxPipe - minPipe + 1)) + minPipe
                        });
                    }
                }
                
                for(let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    let bottomPipeY = p.y + this.gap;
                    
                    // Collision detection
                    if(bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + this.w) {
                        if(bird.y - bird.radius < p.y || bird.y + bird.radius > bottomPipeY) {
                            state.current = state.over;
                            btnAction.textContent = "Tap to Restart";
                        }
                    }
                    
                    p.x -= this.dx;
                    
                    if(p.x + this.w <= 0) {
                        this.position.shift();
                        score.value += 1;
                        score.best = Math.max(score.value, score.best);
                        localStorage.setItem("flappy_best", score.best);
                        i--;
                    }
                }

                // Check portal collision
                for(let i = 0; i < portals.items.length; i++) {
                    let p = portals.items[i];
                    let dx = bird.x - p.x;
                    let dy = bird.y - p.y;
                    if (Math.sqrt(dx*dx + dy*dy) < bird.radius + portals.radius) {
                        bird.gravityDir *= -1;
                        portals.items.splice(i, 1);
                        i--;
                    }
                }
            },
            
            reset: function() {
                this.position = [];
            }
        }

        const score = {
            best: parseInt(localStorage.getItem("flappy_best")) || 0,
            value: 0,
            
            draw: function() {
                ctx.fillStyle = "#FFF";
                ctx.strokeStyle = "#000";
                
                if(state.current == state.game) {
                    ctx.lineWidth = 2;
                    ctx.font = "35px 'Space Grotesk', sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(this.value, canvas.width/2, 50);
                    ctx.strokeText(this.value, canvas.width/2, 50);
                } else if(state.current == state.over) {
                    ctx.font = "25px 'Space Grotesk', sans-serif";
                    ctx.textAlign = "left";
                    ctx.fillText(this.value, 225, 186);
                    ctx.fillText(this.best, 225, 228);
                }
            },
            
            reset: function() {
                this.value = 0;
            }
        }

        function draw() {
            bg.draw();
            pipes.draw();
            portals.draw();
            fg.draw();
            bird.draw();
            score.draw();
            
            if(state.current == state.getReady) {
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.beginPath();
                ctx.roundRect(60, 180, 200, 100, 10);
                ctx.fill();
                
                ctx.fillStyle = "#FFF";
                ctx.font = "bold 30px 'Space Grotesk', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Get Ready", canvas.width/2, 230);
                ctx.font = "16px 'Space Grotesk', sans-serif";
                ctx.fillText("Tap or Space to Fly", canvas.width/2, 260);
            }
            
            if(state.current == state.over) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#eab308";
                ctx.beginPath();
                ctx.roundRect(60, 120, 200, 160, 10);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#FFF";
                ctx.stroke();
                
                ctx.fillStyle = "#FFF";
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 1;
                ctx.font = "bold 28px 'Space Grotesk', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Game Over", canvas.width/2, 155);
                ctx.strokeText("Game Over", canvas.width/2, 155);
                
                ctx.fillStyle = "#000";
                ctx.font = "20px 'Space Grotesk', sans-serif";
                ctx.textAlign = "left";
                ctx.fillText("Score", 80, 186);
                ctx.fillText("Best", 80, 228);
            }
        }

        function update() {
            bird.update();
            fg.update();
            pipes.update();
            portals.update();
        }

        function loop() {
            update();
            draw();
            frames++;
            requestAnimationFrame(loop);
        }

        function action() {
            switch(state.current) {
                case state.getReady:
                    state.current = state.game;
                    btnAction.textContent = "Flap!";
                    bird.flap();
                    break;
                case state.game:
                    bird.flap();
                    break;
                case state.over:
                    pipes.reset();
                    portals.reset();
                    bird.reset();
                    score.reset();
                    state.current = state.getReady;
                    btnAction.textContent = "Tap / Space to Flap";
                    frames = 0;
                    break;
            }
        }

        // Input handling
        window.addEventListener("keydown", function(e) {
            if(e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                action();
            }
        });
        canvas.addEventListener("click", action);
        canvas.addEventListener("touchstart", function(e) {
            e.preventDefault();
            action();
        }, {passive: false});
        btnAction.addEventListener("click", action);

        loop();
    </script>
<script src="../js/app-guardian.js"></script>
</body>
</html>
