<!DOCTYPE html>
<html>

<head>
    <title>Nitrotype Typing Game</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="game-container">
            <!-- Embedded Game -->
            <iframe src="https://www.nitrotype.com" class="game-iframe" title="Nitrotype" allowfullscreen="true"
                scrolling="auto"></iframe>
        </div>
    </div>

</body>

</html>
